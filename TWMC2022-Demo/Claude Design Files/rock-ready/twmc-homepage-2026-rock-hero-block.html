<!-- Homepage hero: paste this entire file into its own full-width Rock HTML block. -->
<link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
<link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&display=swap"
      rel="stylesheet"
    />
<style>
/* ===== 2026 MULTI-CAMPUS HERO (redesign) — self-contained ===== */
      .tw26-hero {
        position: relative;
        overflow: hidden;
        min-height: min(88vh, 760px);
        display: flex;
        align-items: flex-end;
        background: #1a1a1a;
      }
      .tw26-hero__video {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 122%; /* overscan to clip baked-in letterbox bars in the source video */
        object-fit: cover;
        object-position: center;
        z-index: 0;
      }
      .tw26-hero__scrim {
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(to top, rgba(26, 26, 26, 0.92) 0%, rgba(26, 26, 26, 0.35) 42%, rgba(26, 26, 26, 0.15) 70%, rgba(26, 26, 26, 0.45) 100%),
          linear-gradient(105deg, color-mix(in srgb, var(--color-traditional-dark, #5e1b24) 55%, transparent) 0%, transparent 55%);
      }
      .tw26-hero__content {
        position: relative;
        z-index: 2;
        box-sizing: border-box;
        width: 100%;
        max-width: 1320px;
        /* Preserve the desktop offset without moving beyond the hero edge. */
        margin: 0 auto 0 max(0px, calc((100% - 1320px) / 2 - 100px));
        padding: 120px 24px 94px;
      }
      .tw26-hero__title {
        font-family: 'Montserrat', sans-serif;
        font-weight: 800;
        color: #fff;
        font-size: clamp(38px, 5vw, 66px);
        line-height: 1.08;
        letter-spacing: -0.5px;
        text-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
        margin: 0 0 26px;
        max-width: 18ch;
      }
      .tw26-hero__title em {
        font-family: Georgia, 'Times New Roman', serif;
        font-style: italic;
        color: #d4b87a;
      }
      .tw26-hero__sub {
        font-family: inherit;
        font-size: clamp(16px, 1.5vw, 19px);
        line-height: 1.65;
        color: rgba(255, 255, 255, 0.9);
        max-width: 56ch;
        margin: 0 0 30px;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      }
      .tw26-hero__chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .tw26-hero__chip {
        display: inline-flex;
        align-items: center;
        padding: 10px 20px;
        border: 1.5px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
        color: #fff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.2px;
        text-decoration: none;
        white-space: nowrap;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        background: rgba(255, 255, 255, 0.07);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .tw26-hero__chip--solid {
        background: var(--color-traditional, #862633);
        border-color: var(--color-traditional, #862633);
      }
      .tw26-hero__chip:hover,
      .tw26-hero__chip:focus {
        transform: scale(1.04);
        text-decoration: none;
      }
      /* Keep hero button labels and icons white against theme link states. */
      .tw26-hero a.tw26-hero__chip,
      .tw26-hero a.tw26-hero__chip:visited,
      .tw26-hero a.tw26-hero__chip:hover,
      .tw26-hero a.tw26-hero__chip:focus,
      .tw26-hero a.tw26-hero__chip:active {
        color: #fff !important;
      }
      .tw26-hero a.tw26-hero__chip .tw26-hero__play,
      .tw26-hero a.tw26-hero__chip .tw26-hero__play path {
        color: #fff !important;
        fill: #fff !important;
      }
      .tw26-hero__scroll {
        display: none !important;
        position: absolute;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.4);
        background: rgba(0, 0, 0, 0.25);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: tw26HeroBob 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      @keyframes tw26HeroBob {
        0%, 100% { transform: translateX(-50%) translateY(0); }
        50% { transform: translateX(-50%) translateY(6px); }
      }
      @media (max-width: 991px) {
        .tw26-hero { min-height: clamp(520px, 80vh, 720px); }
        .tw26-hero__content { padding: 96px 24px 52px; margin: 0 auto; }
        .tw26-hero__scroll { display: none; }
      }
      @media (max-width: 576px) {
        /* Match the reference's phone height; allow wrapped text to grow. */
        .tw26-hero { min-height: 520px; }
        .tw26-hero__content { padding: 48px 24px; }
        .tw26-hero__title { margin-bottom: 20px; }
        .tw26-hero__sub { margin-bottom: 24px; }
      }
      .tw26-hero a.tw26-hero__chip .tw26-hero__play {
        display: inline-block !important;
        box-sizing: border-box;
        width: 12px !important;
        height: 14px !important;
        padding: 0;
        border: 0 !important;
        background: #fff;
        /* Round each vertex with a quadratic curve. */
        clip-path: path("M 2 1 Q 0 0 0 2 L 0 12 Q 0 14 2 13 L 11 8 Q 13 7 11 6 Z");
        margin-right: 9px;
        flex: 0 0 auto;
      }
      @media (prefers-reduced-motion: reduce) {
        .tw26-hero__scroll { animation: none; }
      }
      /* ===== END HOMEPAGE 2026 CUSTOM CSS ===== */
    
#twmc-homepage-2026-hero .tw26-icon{display:inline-block;width:1em;height:1em;flex-shrink:0;vertical-align:-0.125em}

#twmc-homepage-2026-hero [hidden]{display:none!important}
@media(max-width:430px){#twmc-homepage-2026-hero .container-fluid{padding-left:18px;padding-right:18px}}

</style>

</div>
