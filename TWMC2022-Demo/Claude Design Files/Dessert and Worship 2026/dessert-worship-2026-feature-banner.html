<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Dessert and Worship 2026 Feature Banner</title>
<style>
html,body{margin:0}
body{background:#3a1830}
#dw-feature-banner{box-sizing:border-box;position:relative;isolation:isolate;min-height:clamp(560px,32vw,900px);padding:max(150px,10vw) 24px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#3a1830 url('export/assets/hero-background.png') center/cover no-repeat;text-align:center}
#dw-feature-banner .dw-banner-foliage{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
#dw-feature-banner .dw-banner-side{position:absolute;top:0;height:100%;width:auto;display:block}
#dw-feature-banner .dw-banner-left{left:0}
#dw-feature-banner .dw-banner-right{right:0}
#dw-feature-banner .dw-banner-edge{position:absolute;left:0;width:100%;height:auto;display:block}
#dw-feature-banner .dw-banner-top{top:0}
#dw-feature-banner .dw-banner-bottom{bottom:0}
#dw-feature-banner .dw-banner-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:24px}
#dw-feature-banner .dw-banner-title{display:block;width:clamp(320px,38vw,620px);max-width:100%;height:auto}
#dw-feature-banner .dw-banner-button{box-sizing:border-box;display:inline-block;padding:14px 32px;border:1.5px solid transparent;border-radius:4px;background:linear-gradient(100deg,#fdedc0,#f5c978);box-shadow:0 8px 24px rgba(0,0,0,.28);color:#321729;font-family:Montserrat,Arial,sans-serif;font-size:12px;font-weight:700;line-height:1.4;letter-spacing:1.5px;text-decoration:none;text-transform:uppercase;transition:transform .3s cubic-bezier(.16,1,.3,1),filter .3s ease}
#dw-feature-banner .dw-banner-button:hover{color:#321729;filter:brightness(1.08);transform:translateY(-2px)}
#dw-feature-banner .dw-banner-button:focus-visible{outline:2px solid #fffbda;outline-offset:4px}
@media (max-width:767px){
  #dw-feature-banner{min-height:420px;padding:max(96px,22vw) 18px}
  #dw-feature-banner .dw-banner-side{display:none}
  #dw-feature-banner .dw-banner-edge{left:50%;width:220%;max-width:none;transform:translateX(-50%)}
  #dw-feature-banner .dw-banner-content{gap:20px}
  #dw-feature-banner .dw-banner-title{width:min(100%,320px)}
}
</style>
</head>
<body>
<section id="dw-feature-banner" aria-label="Christmas Dessert and Worship 2026">
  <div class="dw-banner-foliage" aria-hidden="true">
    <img src="export/assets/hero-left.png" alt="" class="dw-banner-side dw-banner-left">
    <img src="export/assets/hero-right.png" alt="" class="dw-banner-side dw-banner-right">
    <img src="export/assets/hero-top.png" alt="" class="dw-banner-edge dw-banner-top">
    <img src="export/assets/hero-bottom.png" alt="" class="dw-banner-edge dw-banner-bottom">
  </div>
  <div class="dw-banner-content">
    <img src="export/assets/title-lockup.png" alt="Women's Ministry Christmas Dessert and Worship, featuring Kristi McLelland" class="dw-banner-title">
    <a href="/dessertandworship" class="dw-banner-button">Learn More</a>
  </div>
</section>
</body>
</html>
