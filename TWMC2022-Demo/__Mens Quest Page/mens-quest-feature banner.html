<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="../favicon-twmc.png" />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quest Feature Banner</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- LOCAL PREVIEW DEPENDENCIES: Rock supplies its site-wide styles, fonts, and icons. -->
    <link
      rel="stylesheet"
      href="https://www.thewoodlandsmethodist.org/Themes/TWMC2022/Styles/bootstrap.css?v1.0.57"
    />
    <link
      rel="stylesheet"
      href="https://www.thewoodlandsmethodist.org/Themes/TWMC2022/Styles/theme.css?1.0.57"
    />
    <link
      rel="stylesheet"
      href="https://people.thewoodlandsmethodist.org/Themes/TWMC2022/Styles/main.css?v1.0.57"
    />
  </head>
  <body>
    <!--
    QUEST 2027 FEATURE BANNER / ROCK RMS COPY GUIDE
    Paste ROCK COPY 1 (styles) and ROCK COPY 2 (banner markup) into a single HTML Content block.
    Skip the document head; Rock supplies Bootstrap 3, fonts, and icons.
    -->

    <!-- ROCK COPY 1: FEATURE BANNER CSS START -->
    <style id="quest2027-banner-styles">
      #quest2027-hero.quest2027-page {
        --quest-hero-background: url("https://rockrms-assets.s3.us-east-2.amazonaws.com/images/_seasonal/_mens/Quest+Feature+Banner+BKG+2027.jpg");
        --quest-ink: #26313b;
        --quest-ink-deep: #1c252d;
        --quest-tan: #bca789;
        --quest-sand: #e9dfce;
        font-family: "Open Sans", Arial, sans-serif;
        background-color: var(--quest-ink);
        background-image: var(--quest-hero-background);
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        /* Half the original artwork ratio (47.2441vw); background-position center crops top and bottom evenly. */
        height: max(180px, 23.622vw);
        position: relative;
        overflow: hidden;
      }
      #quest2027-hero .quest2027-hero--text {
        display: block;
        width: 100%;
        max-width: none;
        height: 100%;
        object-fit: cover;
        object-position: center;
        position: absolute;
        inset: 0;
        /* Shift up by half of (gap + button) so text and button sit centered together. */
        transform: translateY(-2.75rem) scale(0.6375);
        transform-origin: 40% 50%;
      }
      /* Button: same treatment as "Watch past messages".
         Centered under the artwork's text block (text center sits ~40.5% across the banner;
         the text bottom sits ~4.3vw below the artwork's middle, minus the 2.75rem shift). */
      #quest2027-hero .quest2027-hero--button-wrapper {
        position: absolute;
        left: 40.5%;
        top: calc(50% + 4.3vw - 0.25rem);
        /* scale(1.4) = button 40% larger; top-center origin keeps the gap and centering fixed. */
        transform: translateX(-50%) scale(1.4);
        transform-origin: top center;
        z-index: 1;
      }
      #quest2027-hero .quest2027-button {
        border-width: 2px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        white-space: nowrap;
        color: var(--quest-ink-deep);
        background-color: var(--quest-tan);
        border-color: var(--quest-tan);
      }
      #quest2027-hero .quest2027-button:hover,
      #quest2027-hero .quest2027-button:focus {
        color: var(--quest-ink-deep);
        background-color: var(--quest-sand);
        border-color: var(--quest-sand);
      }
      #quest2027-hero .btn:focus-visible {
        outline: 2px solid var(--quest-tan);
        outline-offset: 4px;
      }
      @media only screen and (max-width: 768px) {
        /* Extra room on mobile so the larger artwork text and button fit. */
        #quest2027-hero.quest2027-page {
          height: calc(16vw + 120px);
        }
        #quest2027-hero .quest2027-hero--text {
          width: 154%;
          height: auto;
          inset: auto;
          top: 50%;
          left: 50%;
          transform: translate(-42%, calc(-50% - 2.5rem)) scale(0.6375);
        }
        #quest2027-hero .quest2027-hero--button-wrapper {
          left: 53%;
          top: calc(50% + 6.6vw - 0.5rem);
        }
      }
    </style>
    <!-- ROCK COPY 1: FEATURE BANNER CSS END -->

    <!-- ROCK COPY 2: FEATURE BANNER START -->
    <section id="quest2027-hero" class="quest2027-page">
      <img
        src="https://rockrms-assets.s3.us-east-2.amazonaws.com/images/_seasonal/_mens/Quest+Feature+Banner+TXT+2027.png"
        data-quest2027-asset="hero-text"
        class="quest2027-hero--text"
        alt="Quest Men's Fellowship — Wise Guys: Practical Wisdom from Proverbs"
        width="1270"
        height="600"
        fetchpriority="high"
        decoding="async"
      />
      <div class="quest2027-hero--button-wrapper">
        <a
          href="https://thewoodlandsmethodist.org/quest"
          class="btn btn-primary quest2027-button"
        >Learn More</a>
      </div>
    </section>
    <!-- ROCK COPY 2: FEATURE BANNER END -->
  </body>
</html>
